<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAT ONLINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Roboto:wght@400;700&display=swap');
        :root {
            --primary-magenta: #c20e4d;
            --dark-border: #000000;
        }
        body {
            background-color: #1a1a1a;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .comic-panel {
            background: #fff;
            border: 4px solid var(--dark-border);
            box-shadow: 10px 10px 0px var(--primary-magenta);
            position: relative;
        }
        #loginScreen {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
        }
        .login-title {
            font-family: 'Bangers', cursive;
            font-size: 2.5rem;
            color: var(--primary-magenta);
            text-shadow: 2px 2px 0px var(--dark-border);
            margin-bottom: 10px;
        }
        .avatar-upload-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .avatar-preview {
            width: 100px;
            height: 100px;
            border: 4px solid var(--dark-border);
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transform: rotate(-2deg);
            transition: all 0.2s;
        }
        .avatar-preview:hover {
            transform: scale(1.05) rotate(0deg);
            border-color: var(--primary-magenta);
        }
        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #fileInput { display: none; }
        #chatContainer {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            display: none;
            flex-direction: column;
            transform: rotate(-0.5deg);
        }
        .comic-header {
            background: var(--primary-magenta);
            color: white;
            padding: 1rem;
            border-bottom: 4px solid var(--dark-border);
            display: flex;
            align-items: center;
            gap: 15px;
            clip-path: polygon(0 0, 100% 0, 98% 100%, 0% 100%);
            z-index: 10;
        }
        .header-title {
            font-family: 'Bangers', cursive;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px var(--dark-border);
        }
        .header-avatar {
            width: 40px;
            height: 40px;
            border: 2px solid white;
            object-fit: cover;
        }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f8f8;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .message-wrapper {
            display: flex;
            gap: 10px;
            max-width: 85%;
        }
        .message-wrapper.sent {
            flex-direction: row-reverse;
            align-self: flex-end;
        }
        .message-wrapper.received {
            align-self: flex-start;
        }

        .msg-avatar {
            width: 40px;
            height: 40px;
            border: 2px solid var(--dark-border);
            flex-shrink: 0;
            object-fit: cover;
            background: white;
        }

        .msg-content {
            display: flex;
            flex-direction: column;
        }

        .msg-name {
            font-size: 0.7rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .sent .msg-name { text-align: right; }

        .message {
            padding: 10px 15px;
            border: 3px solid var(--dark-border);
            font-weight: 600;
            word-wrap: break-word;
            font-size: 0.95rem;
        }

        .message-sent {
            background: #fff;
            clip-path: polygon(0% 0%, 100% 0%, 97% 100%, 3% 100%);
            box-shadow: 4px 4px 0px var(--primary-magenta);
        }

        .message-received {
            background: #eeeeee;
            clip-path: polygon(3% 0%, 100% 0%, 100% 100%, 0% 100%);
            box-shadow: -4px 4px 0px var(--dark-border);
        }

        /* Input */
        .comic-input-area {
            padding: 12px;
            border-top: 4px solid var(--dark-border);
            background: #fff;
            display: flex;
            gap: 8px;
        }

        .comic-input {
            flex: 1;
            border: 3px solid var(--dark-border);
            padding: 12px;
            outline: none;
            font-weight: 700;
        }

        .send-btn {
            background: var(--primary-magenta);
            border: 3px solid var(--dark-border);
            padding: 0 20px;
            color: white;
            font-family: 'Bangers', cursive;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="loginScreen" class="comic-panel">
        <h1 class="login-title">INGRESE TU NOMBRE</h1>
        
        <div class="avatar-upload-container">
            <p class="font-bold">FOTO DE PERFIL OvO</p>
            <label for="fileInput" class="avatar-preview" id="previewContainer">
                <span id="placeholderText" class="text-xs text-gray-500 font-bold">CLICK AQUÍ</span>
                <img id="avatarImg" src="" class="hidden">
            </label>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <input type="text" id="nameInput" class="comic-input" placeholder="TU NOMBRE..." maxlength="15">
        <button class="send-btn py-3" id="startBtn">ENTRAR AL CHAT</button>
    </div>

    <div id="chatContainer" class="comic-panel">
        <header class="comic-header">
            <img id="headerAvatarImg" src="" class="header-avatar border-2 border-black">
            <div class="header-title" id="displayUsername">USUARIO</div>
        </header>

        <main class="chat-area" id="chatArea"></main>

        <footer class="comic-input-area">
            <input type="text" id="userInput" class="comic-input" placeholder="ESCRIBIR MENSAJE..." maxlength="200" autocomplete="off">
            <button class="send-btn" id="sendBtn">ENVIAR</button>
        </footer>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const avatarImg = document.getElementById('avatarImg');
        const headerAvatarImg = document.getElementById('headerAvatarImg');
        const placeholderText = document.getElementById('placeholderText');
        const nameInput = document.getElementById('nameInput');
        const startBtn = document.getElementById('startBtn');
        const chatContainer = document.getElementById('chatContainer');
        const loginScreen = document.getElementById('loginScreen');
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        let userProfile = {
            name: "",
            photo: "" 
        };

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    userProfile.photo = event.target.result;
                    avatarImg.src = event.target.result;
                    avatarImg.classList.remove('hidden');
                    placeholderText.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        startBtn.addEventListener('click', () => {
            const name = nameInput.value.trim();
            if (name === "") {
                nameInput.style.borderColor = "red";
                return;
            }
            if (!userProfile.photo) {
                document.getElementById('previewContainer').style.borderColor = "red";
                return;
            }

            userProfile.name = name;
            headerAvatarImg.src = userProfile.photo;
            document.getElementById('displayUsername').textContent = userProfile.name.toUpperCase();
            
            loginScreen.classList.add('hidden');
            chatContainer.style.display = 'flex';
        });

        function addMessage(text, isSent, name, photo) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${isSent ? 'sent' : 'received'}`;

            const img = document.createElement('img');
            img.className = 'msg-avatar';
            img.src = photo || 'https://via.placeholder.com/40';

            const content = document.createElement('div');
            content.className = 'msg-content';

            const nameLbl = document.createElement('div');
            nameLbl.className = 'msg-name';
            nameLbl.textContent = name;

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isSent ? 'message-sent' : 'message-received'}`;
            msgDiv.textContent = text;
            
            content.appendChild(nameLbl);
            content.appendChild(msgDiv);
            wrapper.appendChild(img);
            wrapper.appendChild(content);
            chatArea.appendChild(wrapper);
            
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        function handleSend() {
            const text = userInput.value.trim();
            if (text === "") return;
            addMessage(text, true, userProfile.name, userProfile.photo);
            
            userInput.value = "";
            userInput.focus();
        }
        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
